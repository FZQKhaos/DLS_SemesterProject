# --- Shared building blocks (YAML anchors) --------------------------------
# These &name blocks are not services themselves - they're templates that
# the real services below pull in with "<<: *name", so we don't have to
# repeat the same image/env eight or three times.

x-db-image: &db-image
  image: mcr.microsoft.com/azure-sql-edge:latest
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_SA_PASSWORD: "ArticleService_Dev7!"

x-service-env: &service-env
  ASPNETCORE_URLS: "http://+:80"
  ASPNETCORE_ENVIRONMENT: "Development"
  Database__User: "sa"
  Database__Password: "ArticleService_Dev7!"
  Database__Name: "ArticleDatabase"
  # z-axis split: which host each continent's data lives on. Docker's
  # internal DNS resolves these service names to the right container.
  Shards__Africa: "article-db-africa"
  Shards__Antarctica: "article-db-antarctica"
  Shards__Asia: "article-db-asia"
  Shards__Europe: "article-db-europe"
  Shards__NorthAmerica: "article-db-north-america"
  Shards__SouthAmerica: "article-db-south-america"
  Shards__Oceania: "article-db-oceania"
  Shards__Global: "article-db-global"

x-app-image: &app-image
  build:
    context: .
    dockerfile: ArticleService/Dockerfile
  environment:
    <<: *service-env

# CommentService and ProfanityService are their own swimlane: separate
# databases, separate containers, and - see the (missing!) depends_on
# below - comment-service does NOT wait for or require profanity-service
# to be up. They're independently deployable, and CommentService's
# circuit breaker (CommentService/Program.cs) is what lets it keep
# working when ProfanityService isn't there.
x-comment-service-env: &comment-service-env
  ASPNETCORE_URLS: "http://+:80"
  ASPNETCORE_ENVIRONMENT: "Development"
  Database__Host: "comment-db"
  Database__User: "sa"
  Database__Password: "CommentService_Dev7!"
  Database__Name: "CommentDatabase"
  # Direct service-to-service call, no gateway/UI in between.
  ProfanityService__BaseUrl: "http://profanity-service"

x-profanity-service-env: &profanity-service-env
  ASPNETCORE_URLS: "http://+:80"
  ASPNETCORE_ENVIRONMENT: "Development"
  Database__Host: "profanity-db"
  Database__User: "sa"
  Database__Password: "ProfanityService_Dev7!"
  Database__Name: "ProfanityDatabase"

services:
  # Runs once, creates the Articles table in all eight databases, then
  # exits successfully. The three replicas below wait for that success
  # before starting, so they never race each other over schema creation.
  database-initializer:
    <<: *app-image
    environment:
      <<: *service-env
      Database__InitializeOnly: "true"
    depends_on:
      - article-db-africa
      - article-db-antarctica
      - article-db-asia
      - article-db-europe
      - article-db-north-america
      - article-db-south-america
      - article-db-oceania
      - article-db-global
    restart: "no"

  # --- x-axis split: three identical stateless replicas ------------------
  article-service-1:
    <<: *app-image
    depends_on:
      database-initializer:
        condition: service_completed_successfully
    restart: unless-stopped

  article-service-2:
    <<: *app-image
    depends_on:
      database-initializer:
        condition: service_completed_successfully
    restart: unless-stopped

  article-service-3:
    <<: *app-image
    depends_on:
      database-initializer:
        condition: service_completed_successfully
    restart: unless-stopped

  load-balancer:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
    restart: unless-stopped

  # --- z-axis split: one database per continent, plus one global one -----
  article-db-africa:
    <<: *db-image
    ports: ["14401:1433"]
    volumes: ["africa-data:/var/opt/mssql"]

  article-db-antarctica:
    <<: *db-image
    ports: ["14402:1433"]
    volumes: ["antarctica-data:/var/opt/mssql"]

  article-db-asia:
    <<: *db-image
    ports: ["14403:1433"]
    volumes: ["asia-data:/var/opt/mssql"]

  article-db-europe:
    <<: *db-image
    ports: ["14404:1433"]
    volumes: ["europe-data:/var/opt/mssql"]

  article-db-north-america:
    <<: *db-image
    ports: ["14405:1433"]
    volumes: ["north-america-data:/var/opt/mssql"]

  article-db-south-america:
    <<: *db-image
    ports: ["14406:1433"]
    volumes: ["south-america-data:/var/opt/mssql"]

  article-db-oceania:
    <<: *db-image
    ports: ["14407:1433"]
    volumes: ["oceania-data:/var/opt/mssql"]

  article-db-global:
    <<: *db-image
    ports: ["14408:1433"]
    volumes: ["global-data:/var/opt/mssql"]

  # --- CommentService + ProfanityService, fault-isolated from each other -

  comment-service:
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    environment:
      <<: *comment-service-env
    ports:
      - "8081:80"
    depends_on:
      - comment-db
    restart: unless-stopped

  comment-db:
    <<: *db-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CommentService_Dev7!"
    ports: ["14410:1433"]
    volumes: ["comment-data:/var/opt/mssql"]

  profanity-service:
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    environment:
      <<: *profanity-service-env
    ports:
      - "8082:80"
    depends_on:
      - profanity-db
    restart: unless-stopped

  profanity-db:
    <<: *db-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ProfanityService_Dev7!"
    ports: ["14420:1433"]
    volumes: ["profanity-data:/var/opt/mssql"]

volumes:
  africa-data:
  antarctica-data:
  asia-data:
  europe-data:
  north-america-data:
  south-america-data:
  oceania-data:
  global-data:
  comment-data:
  profanity-data:
