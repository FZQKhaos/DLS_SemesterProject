events {}

http {
    upstream article_service_cluster {
        # Nginx uses round-robin by default: x-axis split across identical replicas.
        server article-service-1:80 max_fails=3 fail_timeout=10s;
        server article-service-2:80 max_fails=3 fail_timeout=10s;
        server article-service-3:80 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://article_service_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If one replica is temporarily unavailable, try another replica.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
