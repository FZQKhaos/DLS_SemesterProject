events {}

http {
    # This is the x-axis split: three identical, stateless ArticleService
    # replicas behind one load balancer. Nginx defaults to round-robin,
    # so requests are simply handed out to whichever replica is next in
    # line - none of them holds more "responsibility" than the others.
    upstream article_service_cluster {
        server article-service-1:80 max_fails=3 fail_timeout=10s;
        server article-service-2:80 max_fails=3 fail_timeout=10s;
        server article-service-3:80 max_fails=3 fail_timeout=10s;
    }

    # Adds which upstream replica served each request to the access log,
    # so the round-robin x-axis split is visible when demoing/debugging.
    log_format upstream_log '$remote_addr - $request [$status] -> $upstream_addr';
    access_log /dev/stdout upstream_log;

    server {
        listen 80;

        location / {
            proxy_pass http://article_service_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If a replica is down, retry the request on another one
            # instead of failing the client's request outright.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
