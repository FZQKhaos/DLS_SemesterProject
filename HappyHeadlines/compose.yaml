services:
  africa-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: africa-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5432:5432"]
    volumes:
      - africa_data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  antarctica-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antarctica-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5433:5432"]
    volumes:
      - antarctica_data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  asia-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asia-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5434:5432"]
    volumes:
      - asia_data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  europe-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: europe-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5435:5432"]
    volumes:
      - europe_data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  north-america-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: north-america-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5436:5432"]
    volumes:
      - north-america-data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  south-america-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: south-america-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5437:5432"]
    volumes:
      - south-america-data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  oceania-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oceania-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5438:5432"]
    volumes:
      - oceania-data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  global-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: global-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    ports: ["5439:5432"]
    volumes:
      - global_data:/var/lib/postgresql/data
      - ./ArticleService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [article-data]

  article-service-1:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["8081:8080"]
    networks: [article-data, article-edge]

  article-service-2:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["8082:8080"]
    networks: [article-data, article-edge]

  article-service-3:
    build:
      context: .
      dockerfile: ArticleService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports: ["8083:8080"]
    networks: [article-data, article-edge]

  lb:
    image: nginx:alpine
    container_name: article-lb
    ports: ["5000:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
    networks: [article-edge]

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comment-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    volumes:
      - comment_data:/var/lib/postgresql/data
      - ./CommentService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d comment-db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [comment-data]

  profanity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profanity-db
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret123
    volumes:
      - profanity_data:/var/lib/postgresql/data
      - ./ProfanityService/Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d profanity-db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [profanity-data]

  profanity-service:
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProfanityDatabase: Host=profanity-db;Database=profanity-db;Username=appuser;Password=secret123
    ports:
      - "6001:8080"
    depends_on:
      profanity-db:
        condition: service_healthy
    networks:
      - profanity-data
      - moderation-link
      - profanity-edge

  comment-service:
    build:
      context: .
      dockerfile: CommentService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CommentDatabase: Host=comment-db;Database=comment-db;Username=appuser;Password=secret123
      ProfanityService__BaseUrl: http://profanity-service:8080
      ProfanityService__TimeoutSeconds: 2
      ProfanityService__CircuitBreakerFailures: 3
      ProfanityService__CircuitBreakerSeconds: 30
      PendingModeration__IntervalSeconds: 10
      PendingModeration__BatchSize: 20
    ports:
      - "6002:8080"
    depends_on:
      comment-db:
        condition: service_healthy
      profanity-service:
        condition: service_started
    networks:
      - comment-data
      - moderation-link
      - comment-edge

volumes:
  africa_data:
  antarctica_data:
  asia_data:
  europe_data:
  north-america-data:
  south-america-data:
  oceania-data:
  global_data:
  comment_data:
  profanity_data:

networks:
  article-data:
    internal: true
  article-edge:
  comment-data:
    internal: true
  profanity-data:
    internal: true
  moderation-link:
    internal: true
  comment-edge:

  profanity-edge: